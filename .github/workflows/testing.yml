name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  phpunit:
    name: WP_UnitTestCase
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            wp-content/plugins/hotel-booking-core/package-lock.json
            wp-content/themes/hotel-booking/package-lock.json

      - name: Build Gutenberg blocks
        working-directory: wp-content/plugins/hotel-booking-core
        run: npm ci && npm run build

      - name: Build theme CSS and blocks
        working-directory: wp-content/themes/hotel-booking
        run: npm ci && npm run build

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: vendor/bin/phpunit

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Gutenberg blocks
        working-directory: wp-content/plugins/hotel-booking-core
        run: npm ci && npm run build

      - name: Build theme CSS and blocks
        working-directory: wp-content/themes/hotel-booking
        run: npm ci && npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start

      - name: Seed hotel pages and a room
        run: bash e2e/wp-env-seed.sh

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8888
          WP_USERNAME: admin
          WP_PASSWORD: password
        run: npm run e2e

  php-analysis:
    name: PHPCS, PHPStan, composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS
        run: composer phpcs

      - name: PHPStan
        run: composer phpstan

      - name: Composer audit
        run: composer audit

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            wp-content/plugins/hotel-booking-core/package-lock.json
            wp-content/themes/hotel-booking/package-lock.json

      - name: Typecheck plugin
        working-directory: wp-content/plugins/hotel-booking-core
        run: npm ci && npm run typecheck

      - name: Typecheck theme
        working-directory: wp-content/themes/hotel-booking
        run: npm ci && npm run typecheck

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Audit Playwright lockfile
        run: npm audit --audit-level=high

      - name: Audit plugin lockfile
        working-directory: wp-content/plugins/hotel-booking-core
        run: npm audit --audit-level=high --omit=dev

      - name: Audit theme lockfile
        working-directory: wp-content/themes/hotel-booking
        run: npm audit --audit-level=high --omit=dev

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Gutenberg blocks
        working-directory: wp-content/plugins/hotel-booking-core
        run: npm ci && npm run build

      - name: Build theme CSS and blocks
        working-directory: wp-content/themes/hotel-booking
        run: npm ci && npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Install Plugin Check
        run: npx wp-env run cli -- wp plugin install plugin-check --activate

      - name: Run Plugin Check
        run: npx wp-env run cli -- wp plugin check hotel-booking-core --require=./wp-content/plugins/plugin-check/cli.php --format=table
