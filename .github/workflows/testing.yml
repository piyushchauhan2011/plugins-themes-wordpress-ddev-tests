name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  phpunit:
    name: WP_UnitTestCase
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gutenberg blocks
        run: pnpm --dir wp-content/plugins/hotel-booking-core run build

      - name: Build theme CSS and blocks
        run: pnpm --dir wp-content/themes/hotel-booking run build

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: vendor/bin/phpunit

      - name: Upload Clover coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage/clover.xml
          if-no-files-found: ignore

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          if-no-files-found: ignore

      - name: Check coverage floor
        run: php bin/check-coverage.php

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gutenberg blocks
        run: pnpm --dir wp-content/plugins/hotel-booking-core run build

      - name: Build theme CSS and blocks
        run: pnpm --dir wp-content/themes/hotel-booking run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start wp-env
        run: pnpm exec wp-env start

      - name: Seed hotel pages and a room
        run: bash e2e/wp-env-seed.sh

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8888
          WP_USERNAME: admin
          WP_PASSWORD: password
        run: pnpm run e2e

  php-analysis:
    name: PHPCS, PHPStan, PHPMD, composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer, cs2pr

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit

      - name: PHPCS
        run: |
          set -o pipefail
          vendor/bin/phpcs -q --report=checkstyle | cs2pr

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

      - name: PHPMD
        run: vendor/bin/phpmd wp-content/plugins/hotel-booking-core,wp-content/themes/hotel-booking github phpmd.xml.dist

      - name: PHPMD XML report
        if: always()
        run: vendor/bin/phpmd wp-content/plugins/hotel-booking-core,wp-content/themes/hotel-booking xml phpmd.xml.dist --reportfile phpmd-report.xml --ignore-violations-on-exit

      - name: Upload PHPMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpmd-report
          path: phpmd-report.xml
          if-no-files-found: ignore

  pr-quality-comment:
    name: PR quality comment
    if: always() && github.event_name == 'pull_request'
    needs:
      - phpunit
      - php-analysis
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Clover coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-clover
          path: coverage

      - name: Download PHPMD report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phpmd-report
          path: .

      - name: Build comment
        continue-on-error: true
        run: php bin/pr-quality-comment.php > pr-quality.md

      - name: Post sticky comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: hotel-booking-pr-quality
          path: pr-quality.md

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck plugin
        run: pnpm --dir wp-content/plugins/hotel-booking-core run typecheck

      - name: Typecheck theme
        run: pnpm --dir wp-content/themes/hotel-booking run typecheck

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Playwright lockfile
        run: pnpm --filter hotel-booking audit --audit-level=high --prod

      - name: Audit plugin lockfile
        run: pnpm --filter hotel-booking-core audit --audit-level=high --prod

      - name: Audit theme lockfile
        run: pnpm --filter hotel-booking-theme audit --audit-level=high --prod

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gutenberg blocks
        run: pnpm --dir wp-content/plugins/hotel-booking-core run build

      - name: Build theme CSS and blocks
        run: pnpm --dir wp-content/themes/hotel-booking run build

      - name: Start wp-env
        run: pnpm exec wp-env start

      - name: Install Plugin Check
        run: pnpm exec wp-env run cli -- wp plugin install plugin-check --activate

      - name: Run Plugin Check
        run: pnpm exec wp-env run cli -- wp plugin check hotel-booking-core --require=./wp-content/plugins/plugin-check/cli.php --format=table
