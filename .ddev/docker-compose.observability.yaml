# Prometheus, Grafana, Loki, Promtail, Tempo: observability profile (ddev start --profiles=observability).
# The web php-logs volume stays always-on so debug.log works without Grafana.
services:
  prometheus:
    container_name: ddev-${DDEV_SITENAME}-prometheus
    image: prom/prometheus:v2.55.1
    profiles:
      - observability
    expose:
      - 9090
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=9090:9090
      - HTTPS_EXPOSE=9091:9090
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
      - ".:/mnt/ddev_config"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
    x-ddev:
      describe-info: |
        UI: ddev launch :9091

  grafana:
    container_name: ddev-${DDEV_SITENAME}-grafana
    image: grafana/grafana:11.5.2
    profiles:
      - observability
    expose:
      - 3000
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=3000:3000
      - HTTPS_EXPOSE=3001:3000
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=light
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/hotel-booking.json
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
      - ".:/mnt/ddev_config"
    depends_on:
      - prometheus
      - loki
      - tempo
    x-ddev:
      describe-info: |
        User: admin
        Pass: admin
        UI: ddev launch :3001

  web:
    volumes:
      - php-logs:/var/log/hotel-booking

  loki:
    container_name: ddev-${DDEV_SITENAME}-loki
    image: grafana/loki:3.4.2
    profiles:
      - observability
    expose:
      - 3100
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=3100:3100
      - HTTPS_EXPOSE=3101:3100
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
      - ".:/mnt/ddev_config"
    command:
      - -config.file=/etc/loki/loki.yml
    x-ddev:
      describe-info: |
        API only (no UI). Ready: ddev launch :3101/ready
        Logs: ddev launch :3001

  promtail:
    container_name: ddev-${DDEV_SITENAME}-promtail
    image: grafana/promtail:3.4.2
    profiles:
      - observability
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - ./loki/promtail.yml:/etc/promtail/config.yml:ro
      - php-logs:/var/log/wordpress:ro
      - ".:/mnt/ddev_config"
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  tempo:
    container_name: ddev-${DDEV_SITENAME}-tempo
    image: grafana/tempo:2.7.2
    profiles:
      - observability
    expose:
      - 3200
      - 4317
      - 4318
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=3200:3200
      - HTTPS_EXPOSE=3201:3200
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo:/var/tempo
      - ".:/mnt/ddev_config"
    command:
      - -config.file=/etc/tempo.yml
    x-ddev:
      describe-info: |
        API only (no UI). Ready: ddev launch :3201/ready
        Traces: ddev launch :3001

volumes:
  prometheus:
  grafana:
  loki:
  php-logs:
  tempo:
