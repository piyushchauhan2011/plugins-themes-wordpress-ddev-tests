# HTTP-context FastCGI cache. Loaded from sites-enabled inside http {},
# not a server {} block. Do not copy onto a production host; see docs/DEPLOYMENT.md.

fastcgi_cache_path /tmp/nginx-fastcgi-cache levels=1:2 keys_zone=WORDPRESS:16m inactive=20m max_size=64m;

map $request_method $skip_cache_method {
    default 0;
    POST    1;
}

map $args $skip_cache_args {
    default 1;
    ""      0;
}

map $request_uri $skip_cache_uri {
    default 0;
    ~*^/wp-admin(/|$)   1;
    ~*wp-login\.php     1;
    ~*wp-cron\.php      1;
    ~*xmlrpc\.php       1;
    ~*^/wp-json(/|$)    1;
}

map $http_cookie $skip_cache_cookie {
    default 0;
    ~*wordpress_logged_in_  1;
    ~*comment_author_       1;
    ~*wp-postpass_          1;
}

# Skip when any of the maps above is 1. Only "0000" is a cacheable GET.
map "$skip_cache_method$skip_cache_args$skip_cache_uri$skip_cache_cookie" $skip_cache {
    default 1;
    "0000"  0;
}
